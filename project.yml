# Generates Kalaam.xcodeproj. Run `make project` (or `xcodegen generate`).
# The .xcodeproj is not committed: this file is the single source of truth.
name: Kalaam
options:
  bundleIdPrefix: com.abdurrub
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  KalaamKit:
    path: Packages/KalaamKit
targets:
  KalaamMac:
    type: application
    platform: macOS
    sources:
      - path: macOS
      - path: Shared
    dependencies:
      - package: KalaamKit
    settings:
      base:
        PRODUCT_NAME: Kalaam
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kalaam.mac
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Kalaam.entitlements
        # Hardened Runtime + App Sandbox (see entitlements). No network entitlement.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme: {}
  KalaamiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - package: KalaamKit
    settings:
      base:
        PRODUCT_NAME: Kalaam
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kalaam.ios
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme: {}
