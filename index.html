<script>
  // Sign-in links for CFoh! (email confirmation, magic link, password reset, Google return)
  // can land on the site root. Forward those to the app with the tokens intact;
  // everything else goes to the Retention Rules website.
  (function () {
    var auth = /(?:^|[#?&])(access_token|refresh_token|code|token_hash|error|error_code|type)=/;
    if (auth.test(location.hash) || auth.test(location.search)) {
      location.replace("/cfoh/app/" + location.search + location.hash);
    } else {
      location.replace("https://retentionrules.com/" + location.hash);
    }
  })();
</script>
